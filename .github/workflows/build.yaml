name: Atualizar estatísticas do perfil

on:
  schedule:
    - cron: '0 4 * * *'   # todo dia às 04:00 UTC
  workflow_dispatch:       # permite rodar manualmente na aba Actions

permissions:
  contents: write
  metadata: read

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - run: pip install -r requirements.txt

      - name: Calcular estatísticas e reescrever os SVGs
        run: python today.py
        env:
          ACCESS_TOKEN: ${{ secrets.ACCESS_TOKEN }}
          USER_NAME: ${{ github.repository_owner }}
          BIRTHDAY: ${{ secrets.BIRTHDAY }}

      - name: Commit das alterações
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add dark_mode.svg light_mode.svg cache
          git diff --cached --quiet || git commit -m "chore: atualiza estatísticas do perfil"
          git push
